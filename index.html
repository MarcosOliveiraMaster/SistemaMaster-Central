<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master | Painel administrativo</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/logo.png" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.3.0"></script>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Lexend:wght@400;700&family=Barlow+Semi+Condensed:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs (ANTES dos scripts do app) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-functions-compat.js"></script>
  
  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            orange: {
              500: '#f28705', 600: '#d97804',
              400: '#ffb347', 300: '#ffcc7f', 100: '#fff7eb'
            }
          },
          fontFamily: {
            comfortaa: ['Comfortaa', 'cursive'],
            lexend:    ['Lexend', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- <style>
    /* Ocultar corpo até autenticação ser verificada */
    body { visibility: hidden; }
  </style> -->
</head>
<body class="bg-gray-50 font-sans">

  <!-- Loading Inicial -->
  <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
    <div class="loading-spinner-large"></div>
    <p class="mt-4 text-orange-500 font-comfortaa font-bold">Carregando dados...</p>
  </div>

  <div class="flex h-screen overflow-hidden">
    <!-- Menu Lateral -->
    <aside id="menu-lateral" class="bg-orange-500 text-white w-72 flex-shrink-0 shadow-xl">
      <!-- Logo -->
      <div class="p-4 border-b border-orange-400">
        <div class="flex items-center justify-center">
          <div id="sidebar-logo-btn" class="w-16 h-16 bg-white rounded-full flex items-center justify-center cursor-pointer flex-shrink-0" title="Recolher/Expandir menu">
            <img src="img/logo.png" alt="Logo Master Educação" class="w-12 h-12">
          </div>
          <div class="sidebar-logo-text ml-3">
            <h1 class="font-lexend font-bold text-lg">Master Educação</h1>
            <p class="font-comfortaa text-xs">Painel Administrativo</p>
          </div>
        </div>
      </div>
      
      <!-- Menu Items -->
      <nav id="div-menuLateral" class="p-3 space-y-1 mt-4">
        <button class="menu-item active" data-section="painel-central">
          <i class="fas fa-home mr-3"></i><span>Painel Central</span>
        </button>
        <button class="menu-item" data-section="banco-aulas">
          <i class="fas fa-book mr-3"></i><span>Banco de Aulas</span>
        </button>
        <button class="menu-item" data-section="simulacoes">
          <i class="fas fa-chart-line mr-3"></i><span>Simulações</span>
        </button>
        <button class="menu-item" data-section="mensagens" data-title="Painel Financeiro">
          <i class="fas fa-wallet mr-3"></i><span>Painel Financeiro</span>
        </button>
        <button class="menu-item" data-section="calendario" data-title="Calendário Master">
          <i class="fas fa-calendar-alt mr-3"></i><span>Calendário Master</span>
        </button>
        <button class="menu-item" data-section="fluxo-processos">
          <i class="fas fa-tasks mr-3"></i><span>Demandas</span>
        </button>
        <button class="menu-item menu-item-expandable" data-section="dashboard" id="btn-dashboard-menu">
          <i class="fas fa-tachometer-alt mr-3"></i>
          <span>Dashboard</span>
          <i class="fas fa-chevron-down ml-auto text-sm transition-transform" id="icon-dashboard-expand"></i>
        </button>
        <div id="submenu-dashboard" class="ml-4 space-y-1 hidden">
          <!-- Clientes -->
          <button class="menu-item-submenu menu-item-submenu-expandable" id="btn-clientes-menu">
            <i class="fas fa-users mr-3"></i>
            <span>Clientes</span>
            <i class="fas fa-chevron-right ml-auto text-xs" id="icon-clientes-expand"></i>
          </button>
          <div id="submenu-clientes" class="ml-3 space-y-1 hidden">
            <button class="menu-item-submenu-leaf" data-section="clientes" data-title="BD Clientes">
              <i class="fas fa-database mr-3"></i><span>BD Clientes</span>
            </button>
          </div>
          <!-- Professores -->
          <button class="menu-item-submenu menu-item-submenu-expandable" id="btn-professores-menu">
            <i class="fas fa-chalkboard-user mr-3"></i>
            <span>Professores</span>
            <i class="fas fa-chevron-right ml-auto text-xs" id="icon-professores-expand"></i>
          </button>
          <div id="submenu-professores" class="ml-3 space-y-1 hidden">
            <button class="menu-item-submenu-leaf" data-section="galeria-professores" data-title="BD Professores">
              <i class="fas fa-database mr-3"></i><span>BD Professores</span>
            </button>
            <!-- ocultos (não apagados): substituídos pela Galeria de Professores acima -->
            <button class="menu-item-submenu-leaf hidden" data-section="professores" data-tab="dp-tab-bancoDados" data-title="BD Professores">
              <i class="fas fa-database mr-3"></i><span>BD Professores</span>
            </button>
            <button class="menu-item-submenu-leaf hidden" data-section="professores" data-tab="dp-tab-edicao" data-title="Edição de Professores">
              <i class="fas fa-user-edit mr-3"></i><span>Edição de Professores</span>
            </button>
            <button class="menu-item-submenu-leaf" data-section="professores" data-tab="dp-tab-candidatos" data-title="Avaliação de Candidatos">
              <i class="fas fa-user-check mr-3"></i><span>Avaliação de Candidatos</span>
            </button>
            <button class="menu-item-submenu-leaf" data-section="professores" data-tab="dp-tab-equipe" data-title="Análise e Desempenho de Equipe">
              <i class="fas fa-chart-line mr-3"></i><span>Análise e Desempenho de Equipe</span>
            </button>
          </div>
        </div>
        <button class="menu-item" data-section="area-pagamento">
          <i class="fas fa-credit-card mr-3"></i><span>Área Pagamento</span>
        </button>
        <button class="menu-item" data-section="cofres-pagamento">
          <i class="fas fa-vault mr-3"></i><span>Cofres e Reservas</span>
        </button>
        <button class="menu-item" data-section="previsao-financeira">
          <i class="fas fa-chart-pie mr-3"></i><span>Previsão Financeira</span>
        </button>
        <button class="menu-item" data-section="exportar-dados">
          <i class="fas fa-file-export mr-3"></i><span>Exportar Dados</span>
        </button>
        <button class="menu-item menu-item-expandable" data-section="area-dev" id="btn-area-dev-menu">
          <i class="fas fa-code mr-3"></i>
          <span>Área Dev</span>
          <i class="fas fa-chevron-down ml-auto text-sm transition-transform" id="icon-area-dev-expand"></i>
        </button>
        <div id="submenu-area-dev" class="ml-4 space-y-1 hidden">
          <button class="menu-item-submenu-leaf" data-section="detalhes-banco-de-aulas" data-title="Detalhes Banco de Aulas">
            <i class="fas fa-table-cells mr-3"></i><span>Detalhes Banco de Aulas</span>
          </button>
        </div>
      </nav>

      <!-- ── Usuário logado + Logout ── -->
      <div class="user-area border-t border-orange-400">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
          <i class="fas fa-user-circle text-base opacity-80"></i>
          <span id="user-email-display" class="opacity-90"></span>
        </div>
        <button
          id="btn-logout"
          class="bg-white bg-opacity-10 hover:bg-opacity-20 transition text-white text-xs font-semibold"
        >
          <i class="fas fa-sign-out-alt"></i>
          <span class="logout-text">Sair</span>
        </button>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-auto">
      <header class="bg-white shadow-sm border-b px-4 py-3">
        <div class="flex justify-between items-center">
          <h1 id="section-title" class="text-xl font-lexend font-bold text-gray-800">Painel Central</h1>
        </div>
      </header>

      <div id="content-area" class="p-4">
        <section id="painel-central"   class="section-content active"></section>
        <section id="banco-aulas"       class="section-content"></section>
        <section id="mensagens"         class="section-content"></section>
        <section id="simulacoes"        class="section-content">
          <div class="text-center py-8">
            <i class="fas fa-chart-line text-3xl text-gray-300 mb-3"></i>
            <h3 class="font-lexend text-lg mb-2">Simulações</h3>
            <p class="text-gray-600 text-sm">Esta seção está em desenvolvimento.</p>
          </div>
        </section>
        <section id="calendario"       class="section-content">
          <div class="text-center py-8">
            <i class="fas fa-calendar-alt text-3xl text-gray-300 mb-3"></i>
            <h3 class="font-lexend text-lg mb-2">Calendário Master</h3>
            <p class="text-gray-600 text-sm">Esta seção está em desenvolvimento.</p>
          </div>
        </section>
        <section id="fluxo-processos" class="section-content"></section>
        <section id="clientes"         class="section-content"></section>
        <section id="professores"      class="section-content"></section>
        <section id="galeria-professores" class="section-content"></section>
        <section id="area-pagamento"   class="section-content"></section>
        <section id="cofres-pagamento"  class="section-content"></section>
        <section id="previsao-financeira" class="section-content"></section>
        <section id="exportar-dados"   class="section-content">
          <div class="text-center py-8">
            <i class="fas fa-file-export text-3xl text-gray-300 mb-3"></i>
            <h3 class="font-lexend text-lg mb-2">Exportar Dados</h3>
            <p class="text-gray-600 text-sm">Esta seção está em desenvolvimento.</p>
          </div>
        </section>
        <section id="detalhes-banco-de-aulas" class="section-content"></section>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <!-- ──────── SCRIPTS (ordem importa) ──────── -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

  <!-- 1. Config centralizada -->
  <script src="firebase-config.js"></script>

  <!-- 2. Autenticação (inicializa Firebase + App Check + guard) -->
  <script src="auth.js"></script>

  <!-- 3. Guard de rota — BLOQUEIA se não autenticado -->
  <script>
    AUTH.requireAuth().then(function (user) {
      // Garantir visibilidade
      document.body.style.visibility = 'visible';
      document.body.style.opacity    = '1';

      var el = document.getElementById('user-email-display');
      if (el) el.textContent = user.email;

      var btnLogout = document.getElementById('btn-logout');
      if (btnLogout) {
        btnLogout.addEventListener('click', function () {
          AUTH.logout();
        });
      }
    });
  </script>

  <!-- 4. Scripts do app (ordem original preservada) -->
  <script src="functions-contrato.js"></script>
  <script src="functions-contratoProfessor.js"></script>
  <script src="banco.js"></script>
  <script src="functions-verificar-datas.js"></script>
  <script src="script.js"></script>
  <script src="functions-disciplinas.js"></script>
  <script src="functions-PainelCentral.js"></script>
  <script src="functions-banco-de-aulas.js"></script>
  <script src="functions-banco-de-aulas-Cards.js"></script>
  <script src="functions-calendario-visual.js"></script>
  <script src="feriados.js"></script>
  <script src="calendario-busca.js"></script>
  <script src="functions-mensagens-automaticas.js"></script>
  <script src="functions-financeiro.js"></script>
  <script src="functions-simulacoes.js"></script>
  <script src="functions-fluxo-processos.js"></script>
  <script src="functions-dashboard.js"></script>

  <!-- Adição de arquivo de Permissão à professores -->
  <script src="authProfessores.js"></script>

  <script src="functions-dashboardCliente.js"></script>
  <script src="functions-dashboardProfessor.js"></script>
  <script src="dashboardProfessores.js"></script>
  <script src="functions-exportar-dados.js"></script>
  <script src="functions-detalhes-banco-de-aulas.js"></script>
  <script src="functions-pagamento.js"></script>
  <script src="functions-cofres-pagamento.js"></script>
  <script src="previsaoFinanceira.js"></script>
</body>
</html>
