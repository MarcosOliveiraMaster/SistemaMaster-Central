name: Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # toda segunda-feira às 8h UTC
    - cron: "0 8 * * 1"

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm install

      - name: Verificar vulnerabilidades críticas (falha o build)
        run: npm audit --audit-level=critical

      - name: Relatório completo de vulnerabilidades (informativo)
        run: npm audit --audit-level=high || true

  lint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm install

      - name: Analisar código em busca de padrões inseguros
        run: npx eslint --ext .js . --max-warnings=20
        continue-on-error: true
